[project]
name = "patchmaps"
version = "0.2.0"
description = "Creates rectangular Patchstructure parallel to permanent traffic lines"
authors = [
  { name = "Marco Donat & Jonas Geistert", email = "marco.donat@zalf.de" },
]
requires-python = ">=3.11, <3.14"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "geopandas>=1.1.3,<2",
  "numpy>=2.4.3,<3",
  "pyproj>=3.7.2,<4",
  "shapely>=2.1.2,<3",
  "scikit-learn>=1.8.0,<2",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.15,<0.16"]

[tool.uv]
default-groups = "all"
